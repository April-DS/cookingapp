name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (fail on warnings/errors, ignore style infos)
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
