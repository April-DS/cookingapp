org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Some plugins (e.g. receive_sharing_intent) compile Java at 8 and Kotlin at 17.
# The resulting bytecode is runtime-compatible on Android, so relax the
# JVM-target consistency check from error to warning to allow the build.
kotlin.jvm.target.validation.mode=warning
